<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization Successful - Spotify to MP3</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container py-5 text-center">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card bg-dark border-success mb-4">
                    <div class="card-body py-5">
                        <div class="mb-4">
                            <i class="fas fa-check-circle text-success fa-5x"></i>
                        </div>
                        
                        <h1 class="display-5 fw-bold mb-4">Authorization Successful!</h1>
                        <p class="lead mb-4">Your Spotify account has been successfully connected.</p>
                        
                        <div class="spinner-border text-primary mb-4" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        
                        <p>Redirecting you back to the application...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Redirect back to main page with session ID
        window.onload = function() {
            // Wait 2 seconds for effect
            setTimeout(function() {
                window.location.href = '/?session_id={{ session_id }}';
            }, 2000);
        };
    </script>
</body>
</html>
